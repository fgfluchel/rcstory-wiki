site_name: RC Story Wiki
site_description: The official lore wiki of the RC Story Cinematic Universe — characters, rigs, units, locations and phenomena.
site_url: https://wiki.rcstoryshow.com/
site_author: House Fluchel Studios
repo_url: https://github.com/fgfluchel/rcstory-wiki
repo_name: rcstory-wiki
edit_uri: edit/main/docs/
copyright: >
  © 2026 House Fluchel Studios LLC · <a href="https://rcstoryshow.com">rcstoryshow.com</a><br>
  As an Amazon Associate, RC Story earns from qualifying purchases.

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
    - scheme: default
      primary: deep orange
      accent: amber
      toggle: {icon: material/weather-night, name: Switch to dark mode}
  icon:
    logo: material/excavator
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - {icon: fontawesome/brands/youtube, link: "https://www.youtube.com/@RCStoryOfficial"}
    - {icon: fontawesome/brands/instagram, link: "https://www.instagram.com/rcstoryofficial/"}
    - {icon: fontawesome/brands/tiktok, link: "https://www.tiktok.com/@housefluchelmechbay"}
    - {icon: fontawesome/brands/facebook, link: "https://www.facebook.com/916366408234846"}
    - {icon: fontawesome/solid/store, link: "https://www.ebay.com/str/rcstorydirect", name: RC Story Direct on eBay}

